plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'java'
}

version = project.mod_version
group = project.mod_group
base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    // Forge 1.20.1 ships sources/targets at Java 17
}

minecraft {
    // Official Mojang mappings for 1.20.1.
    // (Optionally switch to Parchment for parameter names — see note in README_PORT.)
    mappings channel: 'official', version: project.minecraft_version

    // Uncomment during development if you use access transformers:
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// Mixin refmap wiring
mixin {
    add sourceSets.main, "${project.mod_id}.refmap.json"
    config "${project.mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = "KosmX's maven"
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        name = "Spongepowered"
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Mixin annotation processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // KosmX Player Animation Library (Forge) — replaces ZigyTheBird PAL used on Fabric
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${project.playeranim_version}")

    // Required client companion for player-animation-lib; also present in runClient.
    runtimeOnly fg.deobf(files('libs/bendy-lib-forge-4.0.0.jar'))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version    : forge_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    // KosmX PlayerAnimator auto-loads animations ONLY from assets/<ns>/player_animation
    // (singular). The animation JSONs shipped by the original Fabric mod live in
    // player_animations (plural, ZigyTheBird PAL convention) and many static-pose files
    // omit "animation_length"; KosmX's GeckoLib parser then rejects them and crashes the
    // whole load. The fixAnimations task adds a computed "animation_length" wherever it is
    // missing and writes the files under the correct singular folder name; we copy from
    // there and drop the original plural folder.
    dependsOn 'fixAnimations'
    exclude 'assets/testcoop/player_animations/**'
    from("${buildDir}/fixedAnimations")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Make every animation JSON parseable by KosmX: rename the folder to the singular name and
// ensure each animation declares "animation_length" (KosmX throws "Could not recognise
// GeckoLib animation" otherwise, and one bad file crashes the whole client).
tasks.register('fixAnimations') {
    def srcDir = file('src/main/resources/assets/testcoop/player_animations')
    def outDir = file("${buildDir}/fixedAnimations/assets/testcoop/player_animation")
    inputs.dir srcDir
    outputs.dir outDir
    doLast {
        outDir.mkdirs()
        outDir.eachFile { it.delete() }
        def slurper = new groovy.json.JsonSlurper()
        def nonTimeKeys = ['vector', 'easing', 'lerp_mode', 'pre', 'post'] as Set
        def maxTime
        maxTime = { anim ->
            double m = 0.0d
            def bones = anim instanceof Map ? anim['bones'] : null
            if (bones instanceof Map) {
                bones.values().each { bone ->
                    if (bone instanceof Map) {
                        ['rotation', 'position', 'scale'].each { ch ->
                            def channel = bone[ch]
                            if (channel instanceof Map) {
                                channel.keySet().each { k ->
                                    if (!nonTimeKeys.contains(k)) {
                                        try { double t = Double.parseDouble(k as String); if (t > m) m = t } catch (ignored) {}
                                    }
                                }
                            }
                        }
                    }
                }
            }
            return m
        }
        srcDir.listFiles().findAll { it.isFile() && it.name.endsWith('.json') }.each { f ->
            if (f.name.contains(' ')) { return } // invalid ResourceLocation, skip the stray dup
            def data = slurper.parse(f)
            def anims = data instanceof Map ? data['animations'] : null
            if (anims instanceof Map) {
                anims.values().each { anim ->
                    if (anim instanceof Map && !anim.containsKey('animation_length')) {
                        double len = maxTime(anim)
                        anim['animation_length'] = (len > 0.0d) ? len : 0.05d
                    }
                }
            }
            new File(outDir, f.name).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        }
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = project.release_jar_name
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
